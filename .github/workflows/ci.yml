name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hamsa
          POSTGRES_PASSWORD: hamsa
          POSTGRES_DB: hamsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Ephemeral values: the suite runs against the service database and makes
      # no network calls, so nothing here is a real secret.
      HAMSA_SECRET: "ci-only-secret-not-used-outside-this-workflow"
      TEST_DATABASE_URL: "postgres://hamsa:hamsa@127.0.0.1:5432/hamsa_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Dockerfile builds
        run: docker build --tag hamsa:ci .

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high and above)
        run: npm audit --audit-level=high
